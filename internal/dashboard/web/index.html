<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Quality over time</title>
<style>
:root{--bg:#121218;--panel:#1b1b24;--fg:#dcdce6;--dim:#8b8ba0;--line:#2f2f3d;--accent:#a78bfa;--up:#f43f5e;--down:#22c55e;--new:#fbbf24}
@media (prefers-color-scheme: light){:root{--bg:#f5f5f8;--panel:#fff;--fg:#22222c;--dim:#6b6b80;--line:#dcdce6;--accent:#7c3aed;--up:#e11d48;--down:#16a34a;--new:#d97706}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font:13px/1.45 system-ui,-apple-system,Segoe UI,sans-serif}
header{display:flex;flex-wrap:wrap;gap:8px 16px;align-items:baseline;padding:12px 16px;border-bottom:1px solid var(--line)}
header h1{font-size:16px;margin:0}
.dim{color:var(--dim)}
#progress{flex:1;min-width:160px;height:6px;background:var(--line);border-radius:3px;overflow:hidden;align-self:center}
#progress div{height:100%;width:0;background:var(--accent);transition:width .3s}
main{display:grid;grid-template-columns:minmax(0,1.05fr) minmax(0,1fr);gap:12px;padding:12px 16px}
@media (max-width:1000px){main{grid-template-columns:1fr}}
.card{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:10px 12px;min-width:0}
.card h2{font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--dim);margin:0 0 8px}
#stepper{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
#stepper input[type=range]{flex:1;min-width:140px}
button,select{background:transparent;color:var(--fg);border:1px solid var(--line);border-radius:6px;padding:4px 9px;font:inherit;cursor:pointer}
button:hover{border-color:var(--accent)}
#commit{margin-top:8px}
#commit .subject{font-size:14px;font-weight:600;word-break:break-word}
.chips{display:flex;flex-wrap:wrap;gap:4px;margin:6px 0}
.chip{border:1px solid var(--line);border-radius:999px;padding:1px 8px;font-size:12px}
.deltas{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:6px;margin-top:6px}
.delta{border:1px solid var(--line);border-radius:8px;padding:5px 8px}
.delta b{display:block;font-size:15px;font-variant-numeric:tabular-nums}
.up{color:var(--up)}.down{color:var(--down)}
.graphCard{display:flex;flex-direction:column}
#graphWrap{position:relative;flex:1;min-height:480px}
details.how{margin:0 0 8px;font-size:12px}
details.how summary{cursor:pointer;color:var(--accent)}
details.how ul{margin:6px 0 0;padding-left:18px}
details.how li{margin:2px 0}
#changes{margin-top:6px;font-size:12px}
#changes .chip,#nodeDetail .chip{cursor:pointer}
#nodeDetail{margin-top:8px;border-top:1px solid var(--line);padding-top:8px;font-size:12px}
#nodeDetail h3{margin:0 0 4px;font-size:14px;word-break:break-word}
#nodeDetail table{margin:4px 0}
a.link{color:var(--accent);cursor:pointer;text-decoration:none}
#graph{width:100%;height:100%;display:block;border-radius:8px;cursor:grab}
#graphLegend{font-size:12px;margin-top:6px}
.sw{display:inline-block;width:10px;height:10px;border-radius:50%;margin:0 4px 0 10px;vertical-align:-1px}
#tip{position:fixed;pointer-events:none;display:none;background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:6px 8px;font-size:12px;max-width:340px;z-index:9}
.charts{display:grid;gap:10px}
.chart svg{width:100%;height:150px;display:block;overflow:visible}
.chart .ttl{display:flex;justify-content:space-between;gap:8px;font-size:12px}
.chart .legend span{margin-left:8px}
table{width:100%;border-collapse:collapse;font-size:12px}
th,td{padding:4px 6px;border-top:1px solid var(--line);text-align:right;font-variant-numeric:tabular-nums}
th:first-child,td:first-child{text-align:left}
th{color:var(--dim);font-weight:500}
.full{grid-column:1/-1}
#strip{width:100%;height:64px;display:block;cursor:crosshair;user-select:none}
#windowCtl{display:flex;flex-wrap:wrap;gap:6px 10px;align-items:center;margin-top:6px;font-size:12px}
#windowCtl input{background:transparent;color:var(--fg);border:1px solid var(--line);border-radius:6px;padding:3px 6px;font:inherit}
#windowCtl input[type=number]{width:72px}
.notes{font-size:12px;color:var(--dim);margin:6px 0 0;padding-left:16px}
.mono{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:12px}
</style>
</head>
<body>
<header>
  <h1 id="title">Quality over time</h1>
  <span class="dim" id="range"></span>
  <div id="progress" title="metrics computed"><div></div></div>
  <span class="dim" id="progressText"></span>
</header>
<main>
  <section class="card full">
    <h2>History · drag across it to choose which commits to measure</h2>
    <svg id="strip"></svg>
    <div id="windowCtl">
      <span>Last <input type="number" id="lastN" min="1" value="50"> commits <button id="applyLast">Measure</button></span>
      <span>or from <input type="date" id="fromDate"> to <input type="date" id="toDate"> <button id="applyDates">Measure</button></span>
      <span class="dim" id="windowInfo"></span>
    </div>
  </section>
  <section class="card">
    <h2>Commit</h2>
    <div id="stepper">
      <button id="prev" title="previous commit (←)">◀</button>
      <button id="play" title="play / pause (space)">▶ Play</button>
      <button id="next" title="next commit (→)">▶</button>
      <input type="range" id="slider" min="0" max="0" value="0">
      <span class="mono" id="pos"></span>
    </div>
    <div id="commit"></div>
  </section>
  <section class="card">
    <h2>Colour points by provenance</h2>
    <div id="groupPick" class="chips"></div>
    <div id="groupLegend" class="chips"></div>
  </section>
  <section class="card graphCard">
    <h2>Module graph at this commit</h2>
    <details class="how" id="how"><summary>How to read this graph</summary><ul id="howList"></ul></details>
    <div id="graphWrap"><canvas id="graph"></canvas></div>
    <div id="graphLegend"></div>
    <div id="changes"></div>
    <div id="nodeDetail" class="dim">Click a circle for its details.</div>
  </section>
  <section class="card">
    <h2>Metrics by commit</h2>
    <div class="charts" id="charts"></div>
  </section>
  <section class="card full">
    <h2>Step changes by provenance group</h2>
    <div id="groups"></div>
    <ul class="notes" id="notes"></ul>
  </section>
</main>
<div id="tip"></div>
<script>
"use strict";
const $ = id => document.getElementById(id);
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({"&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;"})[c]);
const cssVar = n => getComputedStyle(document.documentElement).getPropertyValue(n).trim();
const fmt = (v, d = 0) => v == null || Number.isNaN(v) ? "–" : Number(v).toLocaleString(undefined, {maximumFractionDigits: d, minimumFractionDigits: d});
const signed = (v, d = 0) => v == null ? "–" : (v > 0 ? "+" : v < 0 ? "−" : "±") + fmt(Math.abs(v), d);
const PALETTE = ["#60a5fa", "#f472b6", "#34d399", "#fbbf24", "#a78bfa", "#f87171", "#2dd4bf", "#fb923c", "#c084fc", "#4ade80", "#e879f9", "#38bdf8"];

let meta = null, metrics = [], sel = 0, playing = null, win = {from: 0, to: 0}, pollTimer = null;
let groupFields = ["model", "harness"];
const groupColor = {};

// ---------- provenance grouping (mirrors internal/attribution.GroupKey) ----------
function value(r, f) {
  if (f === "model" || f === "agent") return (r.model || []).join("+");
  if (f === "harness") return (r.harness || []).join("+");
  return (r.meta || {})[f] || "";
}
function recKey(r) { return groupFields.map(f => f + "=" + (value(r, f) || "(none)")).join(", "); }
function stepKey(c) {
  const rs = (c.provenance || []).filter(r => !(r.merge && r.source === "none"));
  if (!rs.length) return c.provenance && c.provenance.length ? recKey(c.provenance[0]) : "(no commits)";
  const k = recKey(rs[0]);
  return rs.every(r => recKey(r) === k) ? k : "(mixed)";
}
function colorOfKey(k) {
  if (!(k in groupColor)) groupColor[k] = k.includes("(mixed)") ? "#9ca3af" : /^[^=]*=\(none\)(, [^=]*=\(none\))*$/.test(k) ? "#6b7280" : PALETTE[Object.keys(groupColor).length % PALETTE.length];
  return groupColor[k];
}

// ---------- data ----------
async function load() {
  meta = await (await fetch("api/meta")).json();
  document.title = "Quality over time: " + meta.repository;
  $("title").textContent = "Quality over time · " + meta.repository;
  const cs = meta.commits;
  $("range").textContent = `${cs.length} first-parent commits · ${cs[0].sha.slice(0, 8)} → ${cs[cs.length - 1].sha.slice(0, 8)} · ${meta.scoring} · ${meta.rules} · ${meta.clones} · tool ${meta.tool}`;
  $("notes").innerHTML = meta.notes.map(n => `<li>${esc(n)}</li>`).join("");
  $("fromDate").value = cs[0].time.slice(0, 10); $("toDate").value = cs[cs.length - 1].time.slice(0, 10);
  metrics = new Array(cs.length);
  renderGroupPick();
  sel = cs.length - 1;
  await poll();
  select(sel);
}
async function poll() {
  clearTimeout(pollTimer);
  const r = await (await fetch("api/metrics")).json();
  const moved = r.window.from !== win.from || r.window.to !== win.to;
  win = r.window;
  for (const [k, m] of Object.entries(r.metrics)) metrics[+k] = m;
  $("slider").min = win.from; $("slider").max = win.to;
  const busy = r.done < r.total || r.stepsDone < r.total;
  $("progress").firstElementChild.style.width = (100 * r.done / Math.max(1, r.total)) + "%";
  $("progressText").textContent = r.done < r.total ? `measuring ${r.done}/${r.total} commits in the window, newest first…`
    : r.stepsDone < r.total ? `${r.total} commits measured, comparing steps…` : `${r.total} commits in the window measured`;
  $("windowInfo").textContent = `window: commits ${win.from + 1}–${win.to + 1} of ${meta.commits.length} (${meta.commits[win.from].time.slice(0, 10)} → ${meta.commits[win.to].time.slice(0, 10)}) · ${r.measuredOverall} measured so far this session`;
  if (moved && (sel < win.from || sel > win.to)) select(win.to);
  renderStrip(); renderCharts(); renderCommit(); renderGroups();
  pollTimer = setTimeout(poll, busy ? 1500 : 5000);
}
async function setWindow(from, to) {
  const n = meta.commits.length;
  from = Math.max(0, Math.min(n - 1, from)); to = Math.max(0, Math.min(n - 1, to));
  if (from > to) [from, to] = [to, from];
  await fetch("api/window", {method: "POST", headers: {"Content-Type": "application/json"}, body: JSON.stringify({from, to})});
  await poll();
  if (sel < win.from || sel > win.to) select(win.to);
}
$("applyLast").onclick = () => { const n = meta.commits.length, k = Math.max(1, +$("lastN").value || 50); setWindow(n - k, n - 1); };
$("applyDates").onclick = () => {
  const a = $("fromDate").value, b = $("toDate").value, cs = meta.commits;
  let lo = cs.findIndex(c => c.time.slice(0, 10) >= a), hi = -1;
  for (let i = cs.length - 1; i >= 0; i--) if (cs[i].time.slice(0, 10) <= b) { hi = i; break; }
  if (lo < 0 || hi < 0 || lo > hi) { $("windowInfo").textContent = "no commits in that date range"; return; }
  setWindow(lo, hi);
};

// ---------- history strip: every commit, coloured by provenance; drag to choose the window ----------
let brush = null;
function stripIndex(ev) {
  const svg = $("strip"), r = svg.getBoundingClientRect(), n = meta.commits.length;
  return Math.max(0, Math.min(n - 1, Math.floor((ev.clientX - r.left) / r.width * n)));
}
function renderStrip() {
  const svg = $("strip"), W = svg.clientWidth || 800, H = 64, n = meta.commits.length, cs = meta.commits;
  const bins = Math.min(n, Math.max(1, Math.floor(W / 2))), bw = W / bins;
  let out = "";
  for (let b = 0; b < bins; b++) {
    const i = Math.min(n - 1, Math.floor((b + 1) * n / bins) - 1);
    out += `<rect x="${b * bw}" y="14" width="${Math.max(1, bw - .4)}" height="26" fill="${colorOfKey(stepKey(cs[i]))}" opacity=".75"/>`;
  }
  const x = i => i / n * W;
  const a = brush ? Math.min(brush.a, brush.b) : win.from, b = brush ? Math.max(brush.a, brush.b) : win.to;
  out += `<rect x="${x(a)}" y="10" width="${Math.max(2, x(b + 1) - x(a))}" height="34" fill="var(--accent)" fill-opacity=".18" stroke="var(--accent)" stroke-width="1.5"/>`;
  out += `<line x1="${x(sel) + bw / 2}" x2="${x(sel) + bw / 2}" y1="6" y2="48" stroke="var(--fg)" stroke-width="1.5"/>`;
  const label = (i, anchor) => `<text x="${Math.min(W - 2, Math.max(2, x(i)))}" y="60" font-size="10" fill="var(--dim)" text-anchor="${anchor}">${cs[i].time.slice(0, 10)}</text>`;
  out += label(0, "start") + label(Math.floor((n - 1) / 2), "middle") + label(n - 1, "end");
  svg.setAttribute("viewBox", `0 0 ${W} ${H}`);
  svg.innerHTML = out;
}
$("strip").onmousedown = e => { const i = stripIndex(e); brush = {a: i, b: i}; renderStrip(); };
$("strip").onmousemove = e => {
  const i = stripIndex(e), c = meta.commits[i];
  if (brush) { brush.b = i; renderStrip(); }
  showTip(e, `<b>${esc(c.subject)}</b><br><span class="mono">${c.sha.slice(0, 10)}</span> · ${esc(c.time.slice(0, 10))} · ${esc(stepKey(c))}`);
};
$("strip").onmouseleave = hideTip;
addEventListener("mouseup", () => {
  if (!brush) return;
  const a = Math.min(brush.a, brush.b), b = Math.max(brush.a, brush.b);
  brush = null;
  if (a === b) {
    if (a >= win.from && a <= win.to) { select(a); return; }   // a click inside the window selects that commit
    const half = Math.floor((win.to - win.from) / 2);          // outside: move the window there, same size
    setWindow(a - half, a - half + (win.to - win.from));
    return;
  }
  setWindow(a, b);
});

// ---------- provenance picker ----------
function renderGroupPick() {
  $("groupPick").innerHTML = meta.groupFields.map(f => `<label class="chip"><input type="checkbox" value="${esc(f)}" ${groupFields.includes(f) ? "checked" : ""}> ${esc(f)}</label>`).join("");
  $("groupPick").querySelectorAll("input").forEach(i => i.onchange = () => {
    groupFields = [...$("groupPick").querySelectorAll("input:checked")].map(x => x.value);
    if (!groupFields.length) { groupFields = ["model"]; renderGroupPick(); }
    for (const k in groupColor) delete groupColor[k];
    renderAll();
  });
}
function renderLegend() {
  const keys = [...new Set(meta.commits.map(stepKey))];
  $("groupLegend").innerHTML = keys.map(k => `<span class="chip"><span class="sw" style="background:${colorOfKey(k)};margin-left:0"></span>${esc(k)}</span>`).join("");
}
function renderAll() { renderLegend(); renderCharts(); renderCommit(); renderGroups(); drawGraph(); }

// ---------- charts ----------
const CHARTS = [
  {title: "Debt (scoring/v2) by component", stack: true, series: [
    {name: "complexity", color: "#f59e0b", get: m => m.debt.complexity},
    {name: "nesting", color: "#a78bfa", get: m => m.debt.nesting},
    {name: "duplication", color: "#22d3ee", get: m => m.debt.duplication},
    {name: "architecture", color: "#f43f5e", get: m => m.debt.architecture}], total: m => m.debt.total},
  {title: "Score (0–100, comparison only)", series: [{name: "score", color: "#34d399", get: m => m.score}], d: 1},
  {title: "Debt per kLOC", series: [{name: "debt/kLOC", color: "#fb923c", get: m => m.debtPerKLOC}], d: 1},
  {title: "Hotspots and source size", series: [
    {name: "hotspots", color: "#f472b6", get: m => m.hotspots},
    {name: "kLOC×10", color: "#60a5fa", get: m => m.lines / 100}]},
  {title: "Defect findings (rules/v1)", needs: "defects", series: [
    {name: "gate", color: "#f43f5e", get: m => m.gate},
    {name: "advisory", color: "#fbbf24", get: m => m.advisory}]},
  {title: "Near duplication (clones/v1, unscored)", needs: "nearDuplication", series: [
    {name: "near-miss pairs", color: "#22d3ee", get: m => m.nearMisses},
    {name: "fragment pairs", color: "#818cf8", get: m => m.fragments}]},
];
function renderCharts() {
  const host = $("charts");
  if (!host.children.length) host.innerHTML = CHARTS.filter(c => !c.needs || meta[c.needs]).map((c, i) =>
    `<div class="chart" data-i="${CHARTS.indexOf(c)}"><div class="ttl"><span>${esc(c.title)}</span><span class="legend">${c.series.map(s => `<span><span class="sw" style="background:${s.color}"></span>${esc(s.name)}</span>`).join("")}</span></div><svg></svg></div>`).join("");
  host.querySelectorAll(".chart").forEach(div => drawChart(div.querySelector("svg"), CHARTS[+div.dataset.i]));
}
function drawChart(svg, ch) {
  const W = svg.clientWidth || 500, H = 150, L = 44, R = 8, T = 8, B = 18;
  const a0 = win.from, a1 = win.to, span = Math.max(1, a1 - a0), xs = i => L + (a1 === a0 ? (W - L - R) / 2 : (i - a0) * (W - L - R) / span);
  const done = metrics.map((m, i) => [m, i]).filter(([m, i]) => m && m.done && !m.error && i >= a0 && i <= a1);
  const vals = [];
  for (const [m] of done) {
    if (ch.stack) vals.push(ch.series.reduce((a, s) => a + (s.get(m) || 0), 0));
    else for (const s of ch.series) { const v = s.get(m); if (v != null) vals.push(v); }
  }
  let lo = ch.stack ? 0 : Math.min(...vals), hi = Math.max(...vals);
  if (!vals.length) { lo = 0; hi = 1; }
  if (hi === lo) { hi += 1; lo = Math.max(0, lo - 1); }
  const pad = (hi - lo) * .08; if (!ch.stack) lo = Math.max(0, lo - pad); hi += pad;
  const ys = v => T + (H - T - B) * (1 - (v - lo) / (hi - lo));
  let out = `<line x1="${L}" x2="${W - R}" y1="${H - B}" y2="${H - B}" stroke="var(--line)"/>`;
  for (const t of [lo, (lo + hi) / 2, hi]) out += `<text x="${L - 4}" y="${ys(t) + 4}" text-anchor="end" font-size="10" fill="var(--dim)">${fmt(t, ch.d || 0)}</text>`;
  if (ch.stack) {
    let base = done.map(() => 0);
    for (const s of ch.series) {
      const top = done.map(([m], k) => base[k] + (s.get(m) || 0));
      if (done.length) out += `<path d="M${done.map(([, i], k) => `${xs(i)},${ys(top[k])}`).join("L")}L${done.map(([, i], k) => `${xs(i)},${ys(base[k])}`).reverse().join("L")}Z" fill="${s.color}" opacity=".55"/>`;
      base = top;
    }
  } else {
    for (const s of ch.series) {
      const pts = done.filter(([m]) => s.get(m) != null);
      if (pts.length) out += `<polyline fill="none" stroke="${s.color}" stroke-width="1.6" points="${pts.map(([m, i]) => `${xs(i)},${ys(s.get(m))}`).join(" ")}"/>`;
    }
  }
  // provenance-coloured markers on the first series (or total)
  for (const [m, i] of done) {
    const v = ch.stack ? ch.total(m) : ch.series[0].get(m);
    if (v == null) continue;
    out += `<circle cx="${xs(i)}" cy="${ys(v)}" r="${i === sel ? 5 : 3}" fill="${colorOfKey(stepKey(meta.commits[i]))}" stroke="${i === sel ? "var(--fg)" : "none"}" data-i="${i}" style="cursor:pointer"/>`;
  }
  out += `<line x1="${xs(sel)}" x2="${xs(sel)}" y1="${T}" y2="${H - B}" stroke="var(--fg)" stroke-dasharray="3 3" opacity=".5"/>`;
  out += `<rect x="${L}" y="0" width="${W - L - R}" height="${H}" fill="transparent" class="hit"/>`;
  svg.setAttribute("viewBox", `0 0 ${W} ${H}`);
  svg.innerHTML = out;
  const idx = ev => { const r = svg.getBoundingClientRect(); const x = (ev.clientX - r.left) * W / r.width; return Math.max(a0, Math.min(a1, a0 + Math.round((x - L) / Math.max(1e-9, (W - L - R) / span)))); };
  svg.onclick = ev => select(idx(ev));
  svg.onmousemove = ev => {
    const i = idx(ev), m = metrics[i], c = meta.commits[i];
    if (!m || !m.done) return hideTip();
    const rows = ch.series.map(s => `${esc(s.name)}: <b>${fmt(s.get(m), ch.d || 0)}</b>`).join("<br>");
    showTip(ev, `<b>${esc(c.subject)}</b><br><span class="mono">${c.sha.slice(0, 10)}</span> · ${esc(stepKey(c))}<br>${rows}`);
  };
  svg.onmouseleave = hideTip;
}

// ---------- commit panel ----------
function delta(get, i) {
  const a = metrics[i - 1], b = metrics[i];
  if (!a || !b || !a.done || !b.done || a.error || b.error) return null;
  const x = get(a), y = get(b);
  return x == null || y == null ? null : y - x;
}
function renderCommit() {
  const c = meta.commits[sel], m = metrics[sel] || {};
  $("pos").textContent = `${sel + 1}/${meta.commits.length}`;
  const chips = [];
  const fields = new Set(["model", "harness", ...meta.groupFields]);
  const recs = c.provenance.filter(r => !(r.merge && r.source === "none"));
  for (const f of fields) {
    const vs = [...new Set(recs.map(r => value(r, f)).filter(Boolean))];
    if (vs.length) chips.push(`<span class="chip">${esc(f)}: <b>${esc(vs.join(" | "))}</b></span>`);
  }
  const sources = [...new Set(c.provenance.map(r => r.source))].join(", ");
  const d = (label, get, dd = 0, goodDown = true, abs) => {
    const v = delta(get, sel);
    const cls = v == null || Math.abs(v) < 1e-9 ? "" : (v > 0) === goodDown ? "up" : "down";

      <ul style="margin:4px 0;padding-left:18px">${why.map(w => `<li>${w}</li>`).join("") || "<li>below the hotspot thresholds</li>"}</ul>
      ${partners.length ? `<div><span class="dim">Structural clone of:</span><div class="chips">${partners.map(p => `<span class="chip" data-id="${esc(p.id)}">ƒ ${esc(p.label)}</span>`).join("")}</div></div>` : ""}
      <div class="dim">Reduce branching or nesting, or reuse one copy, to remove these points; do not reshape code only to lower the number.</div>`;
  }
  el.querySelectorAll("[data-id]").forEach(x => x.onclick = () => pickId(x.dataset.id, true));
}

// ---------- selection, stepping ----------
function select(i) {
  sel = Math.max(win.from, Math.min(win.to, i));
  $("slider").value = sel;
  renderStrip(); renderCharts(); renderCommit();
  showGraph(sel);
}
$("slider").oninput = e => select(+e.target.value);
$("prev").onclick = () => select(sel - 1);
$("next").onclick = () => select(sel + 1);
$("play").onclick = togglePlay;
function togglePlay() {
  if (playing) { clearInterval(playing); playing = null; $("play").textContent = "▶ Play"; return; }
  if (sel >= win.to) select(win.from);
  $("play").textContent = "❚❚ Pause";
  playing = setInterval(() => { if (sel >= win.to) return togglePlay(); select(sel + 1); }, 1300);
}
addEventListener("keydown", e => {
  if (e.target.tagName === "INPUT" && e.target.type !== "range") return;
  if (e.key === "ArrowLeft") select(sel - 1);
  else if (e.key === "ArrowRight") select(sel + 1);
  else if (e.key === " ") { e.preventDefault(); togglePlay(); }
});
function showTip(e, html) { const t = $("tip"); t.innerHTML = html; t.style.display = "block"; t.style.left = Math.min(e.clientX + 14, innerWidth - 350) + "px"; t.style.top = (e.clientY + 14) + "px"; }
function hideTip() { $("tip").style.display = "none"; }
addEventListener("resize", () => { renderStrip(); renderCharts(); });

load().then(() => { renderLegend(); renderHow(); requestAnimationFrame(frame); }).catch(e => { document.body.insertAdjacentHTML("afterbegin", `<p class="up" style="padding:16px">Failed to load: ${esc(e)}</p>`); });
</script>
</body>
</html>
